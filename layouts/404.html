{{ define "main" }}
<section class="section">
  <div class="wrap measure page-header">
    <p class="hero-kicker">Error 404</p>
    <h1>No such file or directory</h1>
    <p class="page-subtitle">That page doesn't exist — it may have moved, or the link might be wrong.</p>
  </div>
  <div class="wrap measure">
    <p class="meeting-actions">
      <a class="btn btn-primary" href="{{ "/meetings" | relURL }}">Upcoming meetings</a>
      <a class="btn" href="{{ "/" | relURL }}">Home</a>
      {{ with site.Params.links.signal }}<a class="btn" href="{{ . }}">Ask in the group chat</a>{{ end }}
    </p>
  </div>
</section>
{{ end }}
