<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for static/img/og.png (the social share card).
  Regenerate after editing:
    rsvg-convert -w 1200 -h 630 assets/og/og.svg -o static/img/og.png
  Colours track the dark palette in assets/css/main.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.8" cy="0" r="0.9">
      <stop offset="0" stop-color="#2fbf94" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fbf94" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f1216"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect y="618" width="1200" height="12" fill="#2fbf94"/>

  <g transform="translate(96 150)">
    <rect width="96" height="96" rx="18" fill="#2fbf94"/>
    <g fill="none" stroke="#06110d" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 33 L39 48 L24 63"/>
      <path d="M48 63 L72 63"/>
    </g>
  </g>

  <text x="96" y="330" font-family="Liberation Sans, sans-serif" font-size="76" font-weight="bold" fill="#e6e9ed">Reno Linux Users Group</text>
  <text x="96" y="400" font-family="Liberation Sans, sans-serif" font-size="38" fill="#9aa4b0">Linux and open source, back in Reno.</text>
  <text x="96" y="520" font-family="Liberation Mono, monospace" font-size="30" fill="#2fbf94" letter-spacing="2">renolug.org</text>
</svg>
